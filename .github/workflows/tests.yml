name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 完整 requirements.txt 是 CUDA 向的（unsloth/xformers/bitsandbytes），
      # CI 上不可安装也不需要：测试套件全部基于 mock，不调 API、不加载权重。
      # 唯一的重依赖是 CPU 版 torch（core/poem/generator.py 顶层 import）。
      - name: Install test dependencies (CPU torch, no CUDA stack)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest gradio openai pypinyin pingshui-rhyme requests Pillow pyyaml python-dotenv

      - name: Run tests
        run: |
          set -o pipefail
          pytest tests -q 2>&1 | tee pytest_out.txt

      # 失败时把 pytest 摘要提升为 annotation（Actions 页面顶部直接可见，
      # 也可经公开 check-runs annotations API 读取，无需下载完整日志）
      - name: Surface failures as annotations
        if: failure()
        run: |
          { grep -E "^(FAILED|ERROR)" pytest_out.txt || true; tail -8 pytest_out.txt; } \
            | while IFS= read -r line; do echo "::error::${line}"; done
